name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check worker Python syntax
        run: |
          python3 -m py_compile workers/repo-agent-worker.py
          python3 -m py_compile workers/windows-local-chat.py
          python3 -m py_compile workers/windows-local-web-search.py
          python3 -m py_compile workers/windows-text-worker.py

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  connector-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run per-user OAuth connector tests
        run: node --experimental-strip-types --test scripts/user-oauth-registry.test.mjs scripts/github-connector-contract.test.mjs scripts/github-repository-chat.test.mjs
