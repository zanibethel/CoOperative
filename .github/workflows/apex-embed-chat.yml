name: Apex embedded chat v1 safety tests
on:
  pull_request:
    paths:
      - "app/api/embed/apex/chat/**"
      - "lib/runtime/embed-apex-chat.*"
      - "tests/apex-embed.test.mjs"
      - ".github/workflows/apex-embed-chat.yml"
  push:
    branches:
      - "feat/cooperative-apex-embedded-chat-v1"
    paths:
      - "app/api/embed/apex/chat/**"
      - "lib/runtime/embed-apex-chat.*"
      - "tests/apex-embed.test.mjs"
      - ".github/workflows/apex-embed-chat.yml"
permissions:
  contents: read
jobs:
  verify-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run zero-model chat unit tests
        run: node --test tests/apex-embed.test.mjs
