name: Android CoOperativeLocalAI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-local-ai-alpha
    paths:
      - "apps/android/CoOperativeLocalAI/**"
      - ".github/workflows/android-local-ai.yml"
  pull_request:
    paths:
      - "apps/android/CoOperativeLocalAI/**"
      - ".github/workflows/android-local-ai.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/CoOperativeLocalAI

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoOperativeLocalAI-debug
          path: apps/android/CoOperativeLocalAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
