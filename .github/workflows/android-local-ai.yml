name: Android CoOperativeLocalAI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-local-ai-alpha
    paths:
      - "apps/android/CoOperativeLocalAI/**"
      - ".github/workflows/android-local-ai.yml"
  pull_request:
    paths:
      - "apps/android/CoOperativeLocalAI/**"
      - ".github/workflows/android-local-ai.yml"

permissions:
  contents: write

concurrency:
  group: android-local-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/CoOperativeLocalAI

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable alpha debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cooperative-localai-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoOperativeLocalAI-debug
          path: apps/android/CoOperativeLocalAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable Android alpha download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-local-ai-alpha'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CoOperativeLocalAI.apk
          if gh release view android-alpha >/dev/null 2>&1; then
            gh release upload android-alpha CoOperativeLocalAI.apk --clobber
          else
            gh release create android-alpha CoOperativeLocalAI.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "CoOperativeLocalAI Android Alpha" \
              --notes "Development APK for the CoOperativeLocalAI Android private-node and local-AI alpha."
          fi
